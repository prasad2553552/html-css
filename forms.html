<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>job application form</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color:rgb(0, 140, 150);
            margin: 0;
            padding: 20px;
        }

        .form-container {
            width: 10px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            text-align: center;
            color: brown;
        }

        h2 {
            color: greenyellow;
            border-bottom: 2px solid #ddd;
            padding-bottom: 8px;
        }

        label {
            display: orange;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        input[type="date"],
        input[type="file"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid yellow;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 5px;
        }

        .buttons {
            text-align: center;
            margin-top: 20px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        input[type="submit"] {
            background-color: green;
            color: white;
        }

        input[type="reset"] {
            background-color: gray;
            color: white;
        }

        input[type="submit"]:hover {
            background-color: darkgreen;
        }

        input[type="reset"]:hover {
            background-color: red;
        }

        #message {
            text-align: center;
            color: green;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>job appication form </h1>
    <form action="ram.html">
        <label for="full name">Full name</label>
        <input type="text"><br>
        <label for="mail">gmail</label>
        <input type="text"><br>
        <label for="otp">otp</label>
        <input type="number" ><br>
        <label for="phone">mobile NO</label>
        <input type="tel"><br>
        <label for="dob">DOB</label>
        <input type="date"><br>
        <label for="gender">Gender</label>
        <input type="radio" name="gender" value="man">man
        <input type="radio" name="gender" value="female">female
<h2>job details</h2>
        <label for="job position">choose job </label>
        <select name="job" id="job">
            <option value="web development">web development</option>
            <option value="python">python</option>
            <option value="java">java</option>
            <option value="AIML">AIML</option>
        </select><br><br>
        <label for="prefrred work mode">select city</label> <br>
        <input type="radio" name="work" value="Bng">bng
        <input type="radio" name="work" value="hyb">hyb
        <input type="radio" name="work" value="pune">pune <br><br>
        <label for="resume">uplod resume</label>
        <input type="file" name="photo" ><br>
        <input type="checkbox" name="declaration">
        i declare that the information provided is correct <br>
        <input type="submit" value="Apply Now">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
