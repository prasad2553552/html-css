<!DOCTYPE html>
<html>
<head>
<style>
a:link, a:visited {
  background-color: rgb(255, 7, 7);
  color: white;
  border: 2px solid yellow;
  padding: 10px 20px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
}

a:hover, a:active {
  background-color: rgb(90, 0, 128);
  color: black;
}
</style>
</head>
<body>

<h2>Link Button</h2>

<a href="https://fontawesome.com/icons/packs/classic" target="_blank">This is a link</a>

</body>
</html>
