<!DOCTYPE html>
<html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
h1 {
  font-size:6vw;
}

p {
  font-size:5vw;
}
</style>
<body>

<h1>The vw Unit</h1>

<p>Resize the browser window to see how the text size scales.</p>

</body>
</html>
