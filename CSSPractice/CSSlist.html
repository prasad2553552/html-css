<!DOCTYPE html>
<html>
<head>
<style>
ol {
  background: lightblue;
  padding: 20px;
}

ol li {
  background: yellow;
  color: darkred;
  padding: 10px;
  margin-left: 20px;
}

ul {
  background: red;
  padding: 20px;
}

ul li {
  background: green;
  color: aqua;
  margin: 5px;
}
</style>
</head>
<body>

<h1>Styling Lists With Colors, Margins and Padding</h1>

<ol>
  <li>Coffee</li>
  <li>Tea</li>
  <li>Coca Cola</li>
</ol>

<ul>
  <li>Coffee</li>
  <li>Tea</li>
  <li>Coca Cola</li>
</ul>

</body>
</html>
