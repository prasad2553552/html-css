<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>google home page</title>
    <style>
       body {
        background-color: rgb(160, 160, 183);
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
}

header {
    text-align: right;
    padding: 20px;
}

header a {
    color: black;
    text-decoration: none;
    margin-left: 20px;
}

main {
    text-align: center;
    margin-top: 25px;
}

main h1 {
    font-size: 50px;
    margin-bottom: 30px;
}

.search-box {
    width: 550px;
    max-width: 90%;
    margin: auto;
    border: 1px solid black;
    border-radius: 30px;
    padding: 5px 15px;
    display: flex;
    align-items: center;
}

.search-box input {
    flex: 1;
    border: none;
    outline: none;
    padding: 10px;
    font-size: 10px;
}

.search-box span {
    margin-left: 12px;
    cursor: pointer;
}


button {
    background-color: blue;
    color: yellow;
    margin: 30px 5px;
    padding: 12px 20px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
}

footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    background-color: #f2f2f2;
    padding: 15px;
}
    </style>
</head>
<body>
    <header>
        <h1>google</h1>
        <nav>
            <a href="mail">gmail</a>          
            <a href="images">images</a>
        </nav>
    </header>
    <main>
        <h1>👨google👩 </h1>
        <div class="search-box">
    <input type="text" placeholder="Search Google">
    <span>🎤</span>
    <span>📷</span>
    <span>AI Agent</span>
</div>
        <div>
            <button>google search</button>
        </div>
    </main>
<footer>
        <p>India</p>
    </footer>
    

</body>
</html>
