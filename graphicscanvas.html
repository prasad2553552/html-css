<!DOCTYPE html>
<html>
<head>
    <title>graphics</title>
</head>
<body>
    <h1></h1>
        <canvas id="myCanvas" width="200" height="100" style="border: 10px solid">
                your browser not support the HTML canvas tag.
        </canvas>
<script>
var c = document.getElementById("myCanvas");
var ctx = c.getContext("2d");

// Create gradient
var grd = ctx.createRadialGradient(75,50,5,90,60,100);
grd.addColorStop(0,"blue");
grd.addColorStop(1,"black");

// Fill with gradient
ctx.fillStyle = grd;
ctx.fillRect(10,10,150,80);
</script>
</body>
</html>
